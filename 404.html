<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chair's empty — Stackly Beauty House</title>
  <meta name="description" content="The page you're looking for isn't at this address. Find your way back to Stackly.">
  <meta name="robots" content="noindex">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

     <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- AOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

  <!-- Shared site styles + this page's styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/404.css">
</head>

<body class="err-body">

  <!-- ============ CUSTOM CURSOR DOT (decorative, desktop only) ============ -->
  <div class="cursor-dot" id="cursorDot"></div>

  <main class="err">

    <!-- tiny wordmark, not a full header -->
    <a href="index.html" class="err__mark"><img src="assets/images/stackly-white.webp" alt="Stackly logo" class="err-logo-img"></a>

    <!-- ============ 1. THE EMPTY CHAIR ============ -->
    <section class="err__stage" id="errStage">



      <div class="err__copy">
        <span class="err__eyebrow">Appointment not found</span>
        <h1 class="err__num" aria-label="404">
          <span>4</span><span class="err__num-mirror">0</span><span>4</span>
        </h1>
        <p class="err__line">This chair is empty — the page you booked isn't at this address anymore.</p>
        <p class="err__sub">It may have moved, been renamed, or never existed. Let's find you the right room.</p>

        <div class="err__actions">
          <a href="index.html" class="btn btn--primary">Back to Home <i class="fa-solid fa-home"></i></a>
          <button type="button" class="btn btn--ghost" onclick="history.back()">Go Back <i class="fa-solid fa-arrow-left"></i></button>
        </div>
      </div>
    </section>


    <!-- floating botanical decorations -->
    <span class="err__petal err__petal--a" aria-hidden="true"></span>
    <span class="err__petal err__petal--b" aria-hidden="true"></span>
    <span class="err__petal err__petal--c" aria-hidden="true"></span>

  </main>

  <!-- ============ SCRIPTS ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="assets/js/404.js"></script>
</body>

</html>
